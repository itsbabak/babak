
name: Build Frago ARM64 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate and extract Frago source
        id: source
        shell: bash
        run: |
          set -e

          mkdir -p .build/frago-source

          if [ -f "tools/apply_overlay.py" ]; then
            SOURCE_DIR="$GITHUB_WORKSPACE"
            echo "Frago source found in repository root."
          else
            ARCHIVE=$(find "$GITHUB_WORKSPACE" \
              -maxdepth 3 -type f \
              -iname "Frago-Xray-Compat-Source.zip" \
              -print -quit)

            if [ -z "$ARCHIVE" ]; then
              ARCHIVE=$(find "$GITHUB_WORKSPACE" \
                -maxdepth 3 -type f -iname "*.zip" \
                -print -quit)
            fi

            if [ -z "$ARCHIVE" ]; then
              echo "No Frago source ZIP found."
              exit 1
            fi

            echo "Extracting: $ARCHIVE"
            unzip -q "$ARCHIVE" -d .build/frago-source

            APPLY_SCRIPT=$(find .build/frago-source \
              -type f -path "*/tools/apply_overlay.py" \
              -print -quit)

            if [ -z "$APPLY_SCRIPT" ]; then
              echo "Frago tools/apply_overlay.py not found in ZIP."
              exit 1
            fi

            SOURCE_DIR="$(dirname "$(dirname "$APPLY_SCRIPT")")"
          fi

          test -f "$SOURCE_DIR/tools/apply_overlay.py"
          test -f "$SOURCE_DIR/tools/build.py"
          test -d "$SOURCE_DIR/overlay/src/main"

          echo "source_dir=$SOURCE_DIR" >> "$GITHUB_OUTPUT"
          echo "Frago source directory: $SOURCE_DIR"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android build packages
        shell: bash
        run: |
          set -e

          sdkmanager --install \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;26.3.11579264" \
            "cmake;3.22.1"

      - name: Fetch upstream ByeDPIAndroid
        shell: bash
        run: |
          set -e

          mkdir -p .build

          git clone \
            --depth 1 \
            --branch v1.2.0 \
            https://github.com/dovecoteescapee/ByeDPIAndroid.git \
            .build/upstream

          git -C .build/upstream submodule update --init --recursive

      - name: Apply Frago overlay
        shell: bash
        env:
          SOURCE_DIR: ${{ steps.source.outputs.source_dir }}
        run: |
          set -e

          python3 "$SOURCE_DIR/tools/apply_overlay.py" \
            "$GITHUB_WORKSPACE/.build/upstream"

      - name: Build ARM64 APK
        working-directory: .build/upstream
        shell: bash
        run: |
          set -e

          chmod +x gradlew

          ./gradlew \
            --no-daemon \
            --stacktrace \
            clean assembleDebug

      - name: Verify APK architecture
        shell: bash
        run: |
          set -e

          APK=".build/upstream/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "APK was not generated."
            exit 1
          fi

          echo "Checking APK native libraries..."

          unzip -Z1 "$APK" | grep '^lib/' || true

          if ! unzip -Z1 "$APK" | grep -q '^lib/arm64-v8a/'; then
            echo "ARM64 native libraries were not found."
            exit 1
          fi

          if unzip -Z1 "$APK" | grep -Eq '^lib/(armeabi-v7a|x86|x86_64)/'; then
            echo "Unexpected extra ABI found in APK."
            exit 1
          fi

          echo "ARM64 verification passed."

      - name: Prepare APK artifact
        shell: bash
        run: |
          set -e

          mkdir -p artifacts

          cp .build/upstream/app/build/outputs/apk/debug/app-debug.apk \
            artifacts/Frago-ARM64.apk

          sha256sum artifacts/Frago-ARM64.apk \
            > artifacts/SHA256SUMS.txt

          ls -lh artifacts/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Frago-ARM64-APK
          path: artifacts/*
          if-no-files-found: error
          retention-days: 30
