
name: Build Frago ARM64 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

concurrency:
  group: frago-arm64-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      # 1. دریافت مخزن
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. پیدا کردن و استخراج سورس Frago
      - name: Locate and extract Frago source
        id: source
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p .build/frago-source

          if [ -f "tools/apply_overlay.py" ] && [ -f "tools/build.py" ]; then
            SOURCE_DIR="$GITHUB_WORKSPACE"
            echo "Frago source found in repository root."
          else
            ARCHIVE=$(find "$GITHUB_WORKSPACE" \
              -maxdepth 3 \
              -type f \
              -iname "Frago-Xray-Compat-Source.zip" \
              -print -quit)

            if [ -z "$ARCHIVE" ]; then
              ARCHIVE=$(find "$GITHUB_WORKSPACE" \
                -maxdepth 3 \
                -type f \
                -iname "*.zip" \
                -print -quit)
            fi

            if [ -z "$ARCHIVE" ]; then
              echo "No source ZIP found."
              exit 1
            fi

            echo "Extracting: $ARCHIVE"

            unzip -q "$ARCHIVE" -d .build/frago-source

            APPLY_SCRIPT=$(find .build/frago-source \
              -type f \
              -path "*/tools/apply_overlay.py" \
              -print -quit)

            if [ -z "$APPLY_SCRIPT" ]; then
              echo "apply_overlay.py not found."
              exit 1
            fi

            SOURCE_DIR="$(dirname "$(dirname "$APPLY_SCRIPT")")"
          fi

          test -f "$SOURCE_DIR/tools/apply_overlay.py"
          test -f "$SOURCE_DIR/tools/build.py"

          echo "source_dir=$SOURCE_DIR" >> "$GITHUB_OUTPUT"

          echo "Selected source: $SOURCE_DIR"

      # 3. نصب Java
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 4. تنظیم Android SDK
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      # 5. نصب ابزارهای موردنیاز
      - name: Install Android build packages
        shell: bash
        run: |
          set -euo pipefail

          sdkmanager --install \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;26.3.11579264" \
            "cmake;3.22.1"

      # 6. دریافت پروژه اصلی ByeDPIAndroid
      - name: Fetch upstream ByeDPIAndroid
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p .build

          git clone \
            --depth 1 \
            --branch v1.2.0 \
            https://github.com/dovecoteescapee/ByeDPIAndroid.git \
            .build/upstream

          git -C .build/upstream submodule update --init --recursive

      # 7. اعمال تغییرات Frago
      - name: Apply Frago overlay
        shell: bash
        env:
          SOURCE_DIR: ${{ steps.source.outputs.source_dir }}
        run: |
          set -euo pipefail

          python3 "$SOURCE_DIR/tools/apply_overlay.py" \
            "$GITHUB_WORKSPACE/.build/upstream"

          echo "Frago overlay applied successfully."

      # 8. رفع تداخل آیکون‌ها
      - name: Fix duplicate Android launcher icons
        working-directory: .build/upstream
        shell: bash
        run: |
          set -euo pipefail

          RES="app/src/main/res"

          echo "Checking launcher resources..."

          for DIR in "$RES"/mipmap-*; do
            [ -d "$DIR" ] || continue

            for NAME in ic_launcher ic_launcher_round; do
              PNG="$DIR/$NAME.png"
              WEBP="$DIR/$NAME.webp"

              if [ -f "$PNG" ] && [ -f "$WEBP" ]; then
                echo "Duplicate found: $PNG"
                rm -f "$PNG"
              fi
            done
          done

          echo "Checking remaining duplicates..."

          for DIR in "$RES"/mipmap-*; do
            [ -d "$DIR" ] || continue

            for NAME in ic_launcher ic_launcher_round; do
              PNG="$DIR/$NAME.png"
              WEBP="$DIR/$NAME.webp"

              if [ -f "$PNG" ] && [ -f "$WEBP" ]; then
                echo "Duplicate still exists: $DIR/$NAME"
                exit 1
              fi
            done
          done

          echo "Launcher resource check passed."

      # 9. ساخت APK
      - name: Build ARM64 APK
        working-directory: .build/upstream
        shell: bash
        run: |
          set -euo pipefail

          chmod +x gradlew

          ./gradlew \
            --no-daemon \
            --stacktrace \
            clean assembleDebug

      # 10. بررسی معماری APK
      - name: Verify APK architecture
        shell: bash
        run: |
          set -euo pipefail

          APK=".build/upstream/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "APK was not generated."
            exit 1
          fi

          echo "Checking APK native libraries..."

          unzip -Z1 "$APK" | grep '^lib/' || true

          if ! unzip -Z1 "$APK" | grep -q '^lib/arm64-v8a/'; then
            echo "ARM64 libraries not found."
            exit 1
          fi

          if unzip -Z1 "$APK" | grep -Eq \
            '^lib/(armeabi-v7a|x86|x86_64)/'; then
            echo "Unexpected ABI found."
            exit 1
          fi

          echo "ARM64 verification passed."

      # 11. آماده‌سازی خروجی
      - name: Prepare APK artifact
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p artifacts

          cp \
            .build/upstream/app/build/outputs/apk/debug/app-debug.apk \
            artifacts/Frago-ARM64.apk

          sha256sum artifacts/Frago-ARM64.apk \
            > artifacts/SHA256SUMS.txt

          echo "Final APK:"
          ls -lh artifacts/

      # 12. انتشار فایل APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Frago-ARM64-APK
          path: artifacts/*
          if-no-files-found: error
          retention-days: 30
