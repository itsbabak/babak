
name: Build Frago ARM64 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

concurrency:
  group: frago-arm64-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      # 1. دریافت مخزن
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. پیدا کردن سورس Frago
      - name: Locate and extract Frago source
        id: source
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p .build/frago-source

          if [ -f "tools/apply_overlay.py" ] && [ -f "tools/build.py" ]; then
            SOURCE_DIR="$GITHUB_WORKSPACE"
          else
            ARCHIVE=$(find "$GITHUB_WORKSPACE" \
              -maxdepth 3 \
              -type f \
              -iname "Frago-Xray-Compat-Source.zip" \
              -print -quit)

            if [ -z "$ARCHIVE" ]; then
              ARCHIVE=$(find "$GITHUB_WORKSPACE" \
                -maxdepth 3 \
                -type f \
                -iname "*.zip" \
                -print -quit)
            fi

            if [ -z "$ARCHIVE" ]; then
              echo "Frago ZIP not found."
              exit 1
            fi

            echo "Extracting: $ARCHIVE"
            unzip -q "$ARCHIVE" -d .build/frago-source

            APPLY_SCRIPT=$(find .build/frago-source \
              -type f \
              -path "*/tools/apply_overlay.py" \
              -print -quit)

            if [ -z "$APPLY_SCRIPT" ]; then
              echo "apply_overlay.py not found."
              exit 1
            fi

            SOURCE_DIR="$(dirname "$(dirname "$APPLY_SCRIPT")")"
          fi

          test -f "$SOURCE_DIR/tools/apply_overlay.py"
          test -f "$SOURCE_DIR/tools/build.py"
          test -d "$SOURCE_DIR/overlay/src/main"

          echo "source_dir=$SOURCE_DIR" >> "$GITHUB_OUTPUT"
          echo "Frago source: $SOURCE_DIR"

      # 3. نصب Java
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 4. نصب Android SDK
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      # 5. نصب ابزارهای Android
      - name: Install Android build packages
        shell: bash
        run: |
          set -euo pipefail

          sdkmanager --install \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;26.3.11579264" \
            "cmake;3.22.1"

      # 6. دریافت پروژه اصلی
      - name: Fetch upstream ByeDPIAndroid
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p .build

          git clone \
            --depth 1 \
            --branch v1.2.0 \
            https://github.com/dovecoteescapee/ByeDPIAndroid.git \
            .build/upstream

          git -C .build/upstream submodule update --init --recursive

      # 7. اعمال Frago
      - name: Apply Frago overlay
        shell: bash
        env:
          SOURCE_DIR: ${{ steps.source.outputs.source_dir }}
        run: |
          set -euo pipefail

          python3 "$SOURCE_DIR/tools/apply_overlay.py" \
            "$GITHUB_WORKSPACE/.build/upstream"

          echo "Frago overlay applied."

      # 8. حذف آیکون‌های تکراری
      - name: Fix duplicate Android launcher icons
        working-directory: .build/upstream
        shell: bash
        run: |
          set -euo pipefail

          RES="app/src/main/res"

          for DIR in "$RES"/mipmap-*; do
            [ -d "$DIR" ] || continue

            for NAME in ic_launcher ic_launcher_round; do
              PNG="$DIR/$NAME.png"
              WEBP="$DIR/$NAME.webp"

              if [ -f "$PNG" ] && [ -f "$WEBP" ]; then
                echo "Removing duplicate: $PNG"
                rm -f "$PNG"
              fi
            done
          done

          echo "Launcher resource check:"
          find "$RES" -type f \
            \( -name 'ic_launcher.*' -o -name 'ic_launcher_round.*' \) \
            -print

      # 9. تنظیم مخازن Gradle بدون تغییر project.repositories
      - name: Configure Gradle repositories
        shell: bash
        run: |
          set -euo pipefail

          cat > "$RUNNER_TEMP/gradle-init.gradle" <<'EOF'

          settingsEvaluated { settings ->

              // Plugin repositories
              settings.pluginManagement.repositories {
                  maven {
                      url 'https://maven.aliyun.com/repository/gradle-plugin'
                  }
                  maven {
                      url 'https://maven.aliyun.com/repository/google'
                  }
                  maven {
                      url 'https://maven.aliyun.com/repository/public'
                  }
                  gradlePluginPortal()
                  google()
                  mavenCentral()
              }

              // Dependency repositories
              settings.dependencyResolutionManagement.repositories {
                  maven {
                      url 'https://maven.aliyun.com/repository/google'
                  }
                  maven {
                      url 'https://maven.aliyun.com/repository/public'
                  }
                  google()
                  mavenCentral()
              }
          }

          // Buildscript repositories only.
          // Do NOT modify project.repositories.
          gradle.beforeProject { project ->
              project.buildscript.repositories {
                  maven {
                      url 'https://maven.aliyun.com/repository/google'
                  }
                  maven {
                      url 'https://maven.aliyun.com/repository/gradle-plugin'
                  }
                  maven {
                      url 'https://maven.aliyun.com/repository/public'
                  }
                  google()
                  mavenCentral()
              }
          }

          EOF

          echo "Gradle repositories configured."

      # 10. ساخت APK
      - name: Build ARM64 APK
        working-directory: .build/upstream
        shell: bash
        run: |
          set -euo pipefail

          chmod +x gradlew

          ./gradlew \
            --no-daemon \
            --no-configuration-cache \
            --init-script "$RUNNER_TEMP/gradle-init.gradle" \
            --stacktrace \
            clean assembleDebug

          echo "Build completed."

      # 11. بررسی معماری
      - name: Verify APK architecture
        shell: bash
        run: |
          set -euo pipefail

          APK=".build/upstream/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "APK was not generated."
            exit 1
          fi

          echo "APK size:"
          ls -lh "$APK"

          echo "Native libraries:"
          unzip -Z1 "$APK" | grep '^lib/' || true

          if ! unzip -Z1 "$APK" | grep -q '^lib/arm64-v8a/'; then
            echo "ARM64 libraries not found."
            exit 1
          fi

          if unzip -Z1 "$APK" | grep -Eq \
            '^lib/(armeabi-v7a|x86|x86_64)/'; then
            echo "Unexpected ABI found."
            exit 1
          fi

          echo "ARM64 verification passed."

      # 12. آماده‌سازی APK
      - name: Prepare APK artifact
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p artifacts

          cp \
            .build/upstream/app/build/outputs/apk/debug/app-debug.apk \
            artifacts/Frago-ARM64.apk

          sha256sum artifacts/Frago-ARM64.apk \
            > artifacts/SHA256SUMS.txt

          ls -lh artifacts/

      # 13. انتشار APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Frago-ARM64-APK
          path: artifacts/*
          if-no-files-found: error
          retention-days: 30

      # 14. ذخیره گزارش خطا
      - name: Upload build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Frago-Build-Diagnostics
          path: |
            .build/upstream/build/reports/
            .build/upstream/app/build/reports/
          if-no-files-found: ignore
          retention-days: 7
