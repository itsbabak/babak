
name: Build SocksVPN APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build ARM64 APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract Source ZIP
        run: |
          ZIP_FILE="socksVPN-main.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: $ZIP_FILE not found!"
            echo "Available files:"
            find . -maxdepth 2 -type f
            exit 1
          fi

          mkdir -p source
          unzip -q "$ZIP_FILE" -d source

          echo "Extracted source:"
          ls -la source

      - name: Locate Android Project
        run: |
          PROJECT_DIR=$(find source -type f -name gradlew -printf '%h\n' | head -n 1)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: gradlew not found in extracted ZIP"
            find source -maxdepth 4 -type f
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Android project found: $PROJECT_DIR"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Accept Android Licenses
        run: yes | sdkmanager --licenses || true

      - name: Grant Gradle Permission
        run: chmod +x "$PROJECT_DIR/gradlew"

      - name: Build Release APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Find APK
        run: |
          mkdir -p final-apk
          find "$PROJECT_DIR" -type f -name "*.apk" -exec cp {} final-apk/ \;

          if [ -z "$(ls -A final-apk)" ]; then
            echo "ERROR: No APK generated!"
            exit 1
          fi

          ls -lh final-apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SocksVPN-ARM64-APK
          path: final-apk/*.apk
          if-no-files-found: error
          retention-days: 7
