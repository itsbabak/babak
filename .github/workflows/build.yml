
name: Build SocksVPN APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build ARM64 APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Find and Extract ZIP Automatically
        run: |
          set -e

          echo "Searching for ZIP files..."

          ZIP_FILE=$(find . -maxdepth 1 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found!"
            find . -maxdepth 3 -type f
            exit 1
          fi

          echo "Selected ZIP: $ZIP_FILE"

          mkdir -p source
          unzip -q "$ZIP_FILE" -d source

          echo "Extraction completed."

      - name: Find Android Project Automatically
        run: |
          set -e

          echo "Searching for Gradle project..."

          PROJECT_DIR=$(find source -type f -name gradlew -printf '%h\n' | head -n 1)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android Gradle wrapper not found!"

            find source -maxdepth 5 -type f
            exit 1
          fi

          echo "Project found: $PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Accept Android Licenses
        run: yes | sdkmanager --licenses || true

      - name: Grant Gradle Permission
        run: chmod +x "$PROJECT_DIR/gradlew"

      - name: Build Release APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Collect APK Files
        run: |
          set -e

          mkdir -p final-apk

          find "$PROJECT_DIR" -type f -iname "*.apk" \
            -exec cp {} final-apk/ \;

          if [ -z "$(ls -A final-apk)" ]; then
            echo "ERROR: APK not generated!"
            exit 1
          fi

          echo "Generated APK files:"
          ls -lh final-apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SocksVPN-ARM64-APK
          path: final-apk/*.apk
          if-no-files-found: error
          retention-days: 7
