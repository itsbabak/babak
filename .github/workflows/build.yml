
name: Build SocksVPN ARM64 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip zip findutils file

      - name: Configure Android SDK
        shell: bash
        run: |
          set -euo pipefail

          echo "Android SDK: $ANDROID_HOME"

          if [ ! -d "$ANDROID_HOME" ]; then
            echo "Android SDK not found!"
            exit 1
          fi

          echo "Android SDK ready."

      - name: Detect and Extract Project Automatically
        shell: bash
        run: |
          set -euo pipefail

          ROOT="$GITHUB_WORKSPACE"
          BUILD="$ROOT/.build"
          EXTRACT="$BUILD/extracted"

          mkdir -p "$EXTRACT"

          echo "Searching for Gradle project..."

          # First check whether the repository already contains a project.
          GRADLE_FILE=$(find "$ROOT" \
            -type f -name gradlew \
            -not -path "$ROOT/.build/*" \
            -not -path "$ROOT/.git/*" \
            | head -n 1 || true)

          if [ -n "$GRADLE_FILE" ]; then
            PROJECT_DIR=$(dirname "$GRADLE_FILE")
            echo "Existing project found: $PROJECT_DIR"

          else
            echo "Searching for ZIP archives..."

            # Find ZIP files anywhere in the repository.
            mapfile -d '' ZIP_FILES < <(
              find "$ROOT" \
                -type f \
                -iname "*.zip" \
                -not -path "$ROOT/.build/*" \
                -not -path "$ROOT/.git/*" \
                -print0
            )

            if [ "${#ZIP_FILES[@]}" -eq 0 ]; then
              echo "No ZIP archives found."
              echo "Repository files:"
              find "$ROOT" -maxdepth 4 -type f | head -n 100
              exit 1
            fi

            echo "Found ${#ZIP_FILES[@]} ZIP archive(s)."

            # Select the archive that actually contains an Android Gradle project.
            SELECTED=""

            for ZIP in "${ZIP_FILES[@]}"; do
              echo "Checking: $ZIP"

              if unzip -Z1 "$ZIP" 2>/dev/null \
                | grep -Eq '(^|/)gradlew$'; then
                SELECTED="$ZIP"
                break
              fi

              if unzip -Z1 "$ZIP" 2>/dev/null \
                | grep -Eq '(^|/)settings\.gradle(\.kts)?$'; then
                SELECTED="$ZIP"
                break
              fi
            done

            # Fallback: use the largest ZIP if no Gradle marker was found.
            if [ -z "$SELECTED" ]; then
              echo "No Gradle marker found. Using largest ZIP."

              SELECTED=$(
                find "$ROOT" \
                  -type f -iname "*.zip" \
                  -not -path "$ROOT/.build/*" \
                  -not -path "$ROOT/.git/*" \
                  -printf '%s %p\n' \
                  | sort -nr \
                  | head -n 1 \
                  | cut -d' ' -f2-
              )
            fi

            echo "Selected archive: $SELECTED"

            unzip -oq "$SELECTED" -d "$EXTRACT"

            # Extract nested archives when needed.
            for LEVEL in {1..5}; do

              NESTED=""

              while IFS= read -r -d '' ITEM; do
                if unzip -Z1 "$ITEM" 2>/dev/null \
                  | grep -Eq '(^|/)gradlew$|(^|/)settings\.gradle(\.kts)?$'; then
                  NESTED="$ITEM"
                  break
                fi
              done < <(
                find "$EXTRACT" -type f \
                  -iname "*.zip" -print0
              )

              if [ -z "$NESTED" ]; then
                break
              fi

              DEST="$EXTRACT/nested-$LEVEL"
              mkdir -p "$DEST"

              echo "Extracting nested project: $NESTED"

              unzip -oq "$NESTED" -d "$DEST"
              rm -f "$NESTED"

            done

            # Find actual Gradle wrapper.
            GRADLE_FILE=$(find "$EXTRACT" \
              -type f -name gradlew \
              | head -n 1 || true)

            if [ -z "$GRADLE_FILE" ]; then
              echo "Gradle wrapper not found."

              find "$EXTRACT" -maxdepth 5 -type f \
                | head -n 100

              exit 1
            fi

            PROJECT_DIR=$(dirname "$GRADLE_FILE")

          fi

          echo "--------------------------------"
          echo "Project: $PROJECT_DIR"
          echo "--------------------------------"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Fix Duplicate Launcher Icons
        shell: bash
        run: |
          set -euo pipefail

          RES="$PROJECT_DIR/app/src/main/res"

          if [ ! -d "$RES" ]; then
            echo "Resource directory not found: $RES"
            exit 1
          fi

          find "$RES" -type f -name "ic_launcher.png" \
            -print0 | while IFS= read -r -d '' FILE; do

              WEBP="${FILE%.png}.webp"

              if [ -f "$WEBP" ]; then
                rm -f "$FILE"
                echo "Removed duplicate: $FILE"
              fi

          done

          find "$RES" -type f -name "ic_launcher_round.png" \
            -print0 | while IFS= read -r -d '' FILE; do

              WEBP="${FILE%.png}.webp"

              if [ -f "$WEBP" ]; then
                rm -f "$FILE"
                echo "Removed duplicate: $FILE"
              fi

          done

          echo "Icon cleanup completed."

      - name: Configure ARM64
        shell: bash
        run: |
          set -euo pipefail

          APP_MK="$PROJECT_DIR/app/src/main/jni/Application.mk"

          if [ -f "$APP_MK" ]; then

            if grep -q "^APP_ABI" "$APP_MK"; then
              sed -i 's/^APP_ABI.*/APP_ABI := arm64-v8a/' "$APP_MK"
            else
              echo "APP_ABI := arm64-v8a" >> "$APP_MK"
            fi

          fi

          echo "ARM64 configuration completed."

      - name: Prepare Gradle
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          chmod +x gradlew

          echo "Gradle wrapper:"
          ./gradlew --version

      - name: Build APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          ./gradlew \
            --no-daemon \
            clean \
            assembleDebug \
            --stacktrace

      - name: Collect APK
        shell: bash
        run: |
          set -euo pipefail

          OUTPUT="$GITHUB_WORKSPACE/final-apk"

          mkdir -p "$OUTPUT"

          mapfile -t APKS < <(
            find "$PROJECT_DIR" \
              -type f \
              -path "*/build/outputs/apk/*/*.apk"
          )

          if [ "${#APKS[@]}" -eq 0 ]; then
            echo "No APK generated!"
            exit 1
          fi

          for APK in "${APKS[@]}"; do
            NAME=$(basename "$APK")
            cp "$APK" "$OUTPUT/$NAME"
          done

          echo "Generated APK files:"
          ls -lh "$OUTPUT"

          FIRST=$(find "$OUTPUT" -maxdepth 1 \
            -type f -name "*.apk" | head -n 1)

          cp "$FIRST" "$OUTPUT/SocksVPN-ARM64.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SocksVPN-ARM64-APK
          path: final-apk/*.apk
          if-no-files-found: error
          retention-days: 14
