
name: Build SocksVPN ARM64 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip zip findutils

      - name: Find and Extract Source ZIP
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$GITHUB_WORKSPACE/.build"

          ZIP_FILE=$(find "$GITHUB_WORKSPACE" \
            -maxdepth 1 -type f \
            -iname "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "No source ZIP found!"
            exit 1
          fi

          echo "Found: $ZIP_FILE"

          mkdir -p "$GITHUB_WORKSPACE/.build/extracted"

          unzip -oq "$ZIP_FILE" \
            -d "$GITHUB_WORKSPACE/.build/extracted"

          # Extract nested ZIP archives
          for i in {1..5}; do
            NESTED=$(find "$GITHUB_WORKSPACE/.build/extracted" \
              -type f -iname "*.zip" | head -n 1 || true)

            if [ -z "$NESTED" ]; then
              break
            fi

            DEST="${NESTED%.zip}"
            mkdir -p "$DEST"

            echo "Extracting nested archive: $NESTED"

            unzip -oq "$NESTED" -d "$DEST"
            rm -f "$NESTED"
          done

          # Locate Gradle project
          GRADLE_FILE=$(find "$GITHUB_WORKSPACE/.build/extracted" \
            -type f -name gradlew | head -n 1)

          if [ -z "$GRADLE_FILE" ]; then
            echo "gradlew not found!"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLE_FILE")

          echo "Project: $PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Fix Duplicate Launcher Icons
        shell: bash
        run: |
          set -euo pipefail

          RES="$PROJECT_DIR/app/src/main/res"

          if [ ! -d "$RES" ]; then
            echo "Resource directory not found: $RES"
            exit 1
          fi

          echo "Checking duplicate launcher icons..."

          find "$RES" -type f -name "ic_launcher.png" | while read -r FILE; do
            WEBP="${FILE%.png}.webp"

            if [ -f "$WEBP" ]; then
              rm -f "$FILE"
              echo "Removed duplicate: $FILE"
            fi
          done

          find "$RES" -type f -name "ic_launcher_round.png" | while read -r FILE; do
            WEBP="${FILE%.png}.webp"

            if [ -f "$WEBP" ]; then
              rm -f "$FILE"
              echo "Removed duplicate: $FILE"
            fi
          done

          echo "Icon check completed."

      - name: Configure ARM64 Native Build
        shell: bash
        run: |
          set -euo pipefail

          APP_MK="$PROJECT_DIR/app/src/main/jni/Application.mk"

          if [ -f "$APP_MK" ]; then
            if grep -q "^APP_ABI" "$APP_MK"; then
              sed -i 's/^APP_ABI.*/APP_ABI := arm64-v8a/' "$APP_MK"
            else
              echo "APP_ABI := arm64-v8a" >> "$APP_MK"
            fi
          fi

          echo "ARM64 configuration checked."

      - name: Grant Gradle Permission
        run: |
          chmod +x "$PROJECT_DIR/gradlew"

      - name: Build Debug APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          ./gradlew \
            --no-daemon \
            clean \
            assembleDebug \
            --stacktrace

      - name: Collect APK
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$GITHUB_WORKSPACE/final-apk"

          find "$PROJECT_DIR" \
            -type f \
            -path "*/build/outputs/apk/*/*.apk" \
            -exec cp {} "$GITHUB_WORKSPACE/final-apk/" \;

          if [ -z "$(find "$GITHUB_WORKSPACE/final-apk" -name "*.apk")" ]; then
            echo "APK not generated!"
            exit 1
          fi

          cd "$GITHUB_WORKSPACE/final-apk"

          for APK in *.apk; do
            mv "$APK" "SocksVPN-ARM64.apk"
            break
          done

          ls -lh

      - name: Upload ARM64 APK
        uses: actions/upload-artifact@v4
        with:
          name: SocksVPN-ARM64-APK
          path: final-apk/*.apk
          if-no-files-found: error
          retention-days: 14
