
name: Build SocksVPN ARM64 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip zip findutils

      - name: Configure Android SDK
        shell: bash
        run: |
          set -euo pipefail

          echo "Android SDK: $ANDROID_HOME"

          if [ ! -d "$ANDROID_HOME" ]; then
            echo "Android SDK not found!"
            exit 1
          fi

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -f "$SDKMANAGER" ]; then
            SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" \
              -type f -name sdkmanager | sort -V | tail -n 1)
          fi

          if [ -z "$SDKMANAGER" ] || [ ! -f "$SDKMANAGER" ]; then
            echo "SDK Manager not found!"
            exit 1
          fi

          chmod +x "$SDKMANAGER"

          yes | "$SDKMANAGER" --licenses \
            || echo "Some licenses may already be accepted."

          echo "Android SDK ready."

      - name: Find and Extract Source ZIP
        shell: bash
        run: |
          set -euo pipefail

          BUILD_DIR="$GITHUB_WORKSPACE/.build"
          EXTRACT_DIR="$BUILD_DIR/extracted"

          mkdir -p "$EXTRACT_DIR"

          ZIP_FILE=$(find "$GITHUB_WORKSPACE" \
            -maxdepth 1 -type f \
            -iname "*.zip" | head -n 1 || true)

          if [ -z "$ZIP_FILE" ]; then
            echo "Source ZIP not found!"
            exit 1
          fi

          echo "Source archive: $ZIP_FILE"

          unzip -oq "$ZIP_FILE" -d "$EXTRACT_DIR"

          for i in {1..5}; do

            NESTED=$(find "$EXTRACT_DIR" \
              -type f -iname "*.zip" | head -n 1 || true)

            if [ -z "$NESTED" ]; then
              break
            fi

            DEST="${NESTED%.zip}"

            mkdir -p "$DEST"

            echo "Extracting nested ZIP: $NESTED"

            unzip -oq "$NESTED" -d "$DEST"

            rm -f "$NESTED"

          done

          GRADLE_FILE=$(find "$EXTRACT_DIR" \
            -type f -name gradlew | head -n 1 || true)

          if [ -z "$GRADLE_FILE" ]; then
            echo "Gradle wrapper not found!"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLE_FILE")

          echo "Project directory: $PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Fix Duplicate Launcher Icons
        shell: bash
        run: |
          set -euo pipefail

          RES="$PROJECT_DIR/app/src/main/res"

          if [ ! -d "$RES" ]; then
            echo "Android resources directory not found!"
            exit 1
          fi

          find "$RES" -type f -name "ic_launcher.png" \
            -print0 | while IFS= read -r -d '' FILE; do

              WEBP="${FILE%.png}.webp"

              if [ -f "$WEBP" ]; then
                rm -f "$FILE"
                echo "Removed duplicate: $FILE"
              fi

          done

          find "$RES" -type f -name "ic_launcher_round.png" \
            -print0 | while IFS= read -r -d '' FILE; do

              WEBP="${FILE%.png}.webp"

              if [ -f "$WEBP" ]; then
                rm -f "$FILE"
                echo "Removed duplicate: $FILE"
              fi

          done

          echo "Launcher icons checked."

      - name: Configure ARM64 Native Build
        shell: bash
        run: |
          set -euo pipefail

          APP_MK="$PROJECT_DIR/app/src/main/jni/Application.mk"

          if [ -f "$APP_MK" ]; then

            if grep -q "^APP_ABI" "$APP_MK"; then
              sed -i 's/^APP_ABI.*/APP_ABI := arm64-v8a/' "$APP_MK"
            else
              echo "APP_ABI := arm64-v8a" >> "$APP_MK"
            fi

          fi

          echo "ARM64 configuration checked."

      - name: Accept Android Licenses
        shell: bash
        run: |
          set -euo pipefail

          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" \
            -type f -name sdkmanager | sort -V | tail -n 1)

          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses || true
          fi

      - name: Build ARM64 APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          chmod +x gradlew

          ./gradlew \
            --no-daemon \
            clean \
            assembleDebug \
            --stacktrace

      - name: Collect APK
        shell: bash
        run: |
          set -euo pipefail

          OUTPUT="$GITHUB_WORKSPACE/final-apk"

          mkdir -p "$OUTPUT"

          find "$PROJECT_DIR" \
            -type f \
            -path "*/build/outputs/apk/*/*.apk" \
            -exec cp {} "$OUTPUT/" \;

          APK=$(find "$OUTPUT" -type f -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "APK not generated!"
            exit 1
          fi

          mv "$APK" "$OUTPUT/SocksVPN-ARM64.apk"

          echo "APK generated:"
          ls -lh "$OUTPUT"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SocksVPN-ARM64-APK
          path: final-apk/SocksVPN-ARM64.apk
          if-no-files-found: error
          retention-days: 14
