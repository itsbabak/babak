name: Build Frago APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Frago source ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE="$(find . -maxdepth 2 -type f -name 'Frago-GitHub-Source-FIX2.zip' -print -quit)"
          if [ -z "$ZIP_FILE" ]; then
            echo "Frago ZIP was not found in the repository."
            exit 1
          fi
          mkdir -p .frago-extract
          unzip -q "$ZIP_FILE" -d .frago-extract
          APPLY_FILE="$(find .frago-extract -type f -path '*/tools/apply_overlay.py' -print -quit)"
          if [ -z "$APPLY_FILE" ]; then
            echo "The ZIP does not contain tools/apply_overlay.py."
            echo "Check that the correct complete Frago source ZIP was uploaded."
            exit 1
          fi
          SOURCE_ROOT="$(dirname "$(dirname "$APPLY_FILE")")"
          echo "Using Frago source root: $SOURCE_ROOT"
          cp -a "$SOURCE_ROOT"/. .
          test -f tools/apply_overlay.py
          test -f overlay/src/main/java/io/github/dovecoteescapee/byedpi/FragoActivity.kt
          test -f frago-config.example.json
          echo "Frago source extracted and verified."

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android build packages
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager --install \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;26.3.11579264" \
            "cmake;3.22.1"

      - name: Fetch upstream native Android project
        run: |
          mkdir -p .build
          git clone --depth 1 --branch v1.2.0 https://github.com/dovecoteescapee/ByeDPIAndroid.git .build/upstream
          git -C .build/upstream submodule update --init --recursive

      - name: Apply Frago app overlay
        run: python3 tools/apply_overlay.py .build/upstream

      - name: Remove duplicate launcher icon resources
        shell: bash
        run: |
          set -euo pipefail
          RES_DIR=".build/upstream/app/src/main/res"
          if [ -d "$RES_DIR" ]; then
            find "$RES_DIR" -type f \\
              \( -path '*/mipmap-*/ic_launcher.png' -o -path '*/mipmap-*/ic_launcher_round.png' \) \\
              -print -delete
          fi

      - name: Build arm64 APK
        working-directory: .build/upstream
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon clean assembleDebug

      - name: Prepare artifact
        run: |
          mkdir -p artifacts
          cp .build/upstream/app/build/outputs/apk/debug/app-debug.apk artifacts/Frago-arm64-debug.apk
          sha256sum artifacts/Frago-arm64-debug.apk > artifacts/SHA256SUMS.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Frago-arm64-debug-apk
          path: artifacts/*
          if-no-files-found: error
          retention-days: 30
