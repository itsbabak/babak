name: Build SocksVPN Lite ARM64 APK

on:
  workflow_dispatch:
    inputs:
      source_zip:
        description: 'ZIP سورس در ریشه مخزن (اگر سورس مستقیماً در مخزن نیست)'
        required: false
        default: 'SocksVPN-Lite-Fragment-Fix-Source.zip'
  push:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract source ZIP when needed
        id: source
        shell: bash
        env:
          SOURCE_ZIP_INPUT: ${{ inputs.source_zip }}
        run: |
          set -euo pipefail
          if [[ -f "$GITHUB_WORKSPACE/gradlew" ]]; then
            PROJECT_DIR="$GITHUB_WORKSPACE"
            echo "Source project already exists in repository root."
          else
            ZIP_PATH="$GITHUB_WORKSPACE/${SOURCE_ZIP_INPUT:-SocksVPN-Lite-Fragment-Fix-Source.zip}"
            if [[ ! -f "$ZIP_PATH" ]]; then
              echo "ERROR: Source ZIP not found: $ZIP_PATH" >&2
              echo "Upload SocksVPN-Lite-Fragment-Fix-Source.zip to the repository root, or commit the Android project files directly." >&2
              exit 1
            fi
            EXTRACT_DIR="$RUNNER_TEMP/socksvpn-source"
            mkdir -p "$EXTRACT_DIR"
            unzip -q "$ZIP_PATH" -d "$EXTRACT_DIR"
            GRADLEW_PATH="$(find "$EXTRACT_DIR" -type f -name gradlew -print -quit)"
            if [[ -z "$GRADLEW_PATH" ]]; then
              echo "ERROR: ZIP does not contain a Gradle Android project (gradlew not found)." >&2
              exit 1
            fi
            PROJECT_DIR="$(dirname "$GRADLEW_PATH")"
            echo "Extracted source project: $PROJECT_DIR"
          fi
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Set up Java 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platforms;android-31" "build-tools;31.0.0" "platform-tools"

      - name: Download Xray ARM64 core
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.source.outputs.project_dir }}
        run: |
          set -euo pipefail
          XRAY_VERSION="v26.11.9"
          XRAY_SHA256="edcefc25b9b3195b11e18624c8269a969d6aabc39c6298a9a5ab29de15d46f3b"
          ARCHIVE="$RUNNER_TEMP/xray-android-arm64.zip"
          curl -fL --retry 3 --retry-delay 2 \
            "https://github.com/XTLS/Xray-core/releases/download/${XRAY_VERSION}/Xray-android-arm64-v8a.zip" \
            -o "$ARCHIVE"
          echo "${XRAY_SHA256}  ${ARCHIVE}" | sha256sum --check -
          mkdir -p "$RUNNER_TEMP/xray-core"
          unzip -q "$ARCHIVE" -d "$RUNNER_TEMP/xray-core"
          XRAY_BIN="$(find "$RUNNER_TEMP/xray-core" -type f -name xray -print -quit)"
          test -n "$XRAY_BIN"
          install -D -m 755 "$XRAY_BIN" "$PROJECT_DIR/app/src/main/jniLibs/arm64-v8a/libxray.so"
          mkdir -p "$PROJECT_DIR/app/src/main/assets/xray"
          curl -fL --retry 3 \
            "https://raw.githubusercontent.com/XTLS/Xray-core/${XRAY_VERSION}/LICENSE" \
            -o "$PROJECT_DIR/app/src/main/assets/xray/LICENSE"
          readelf -h "$PROJECT_DIR/app/src/main/jniLibs/arm64-v8a/libxray.so" | grep -Eq 'Machine:.*AArch64'

      - name: Build APKs
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.source.outputs.project_dir }}
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace clean assembleDebug assembleRelease

      - name: Upload APK files
        uses: actions/upload-artifact@v4
        with:
          name: SocksVPN-Lite-ARM64-APKs
          path: |
            ${{ steps.source.outputs.project_dir }}/app/build/outputs/apk/debug/app-debug.apk
            ${{ steps.source.outputs.project_dir }}/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
